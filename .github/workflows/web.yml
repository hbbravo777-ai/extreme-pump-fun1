name: Web app checks

on:
  push:
    paths:
      - "web/**"
      - "package.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "package.json"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit -p web/tsconfig.json
      - run: npm run web:build
