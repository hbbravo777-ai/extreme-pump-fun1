[package]
name = "extreme_pump_fun"
version = "0.2.0"
description = "Extreme Pump.Fun Solana launchpad program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "extreme_pump_fun"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["associated_token", "token"] }
